# fly.toml app configuration file generated for pydata-amsterdam-2026-taking-flight-with-arrow-flight on 2026-08-01T12:38:03+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pydata-amsterdam-2026-taking-flight-with-arrow-flight'
primary_region = 'arn'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['rest']

[processes]
rest = "fly start rest"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

include:
  - compose.yaml

services:
  rest:
    build:
      context: .
      dockerfile: rest/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql+psycopg://postgres:postgres@db:5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    develop:
      watch:
        - action: rebuild
          path: rest/src
  server:
    build:
      context: .
      dockerfile: flight_server/Dockerfile
    ports:
      - "7001:7001"
    depends_on:
      db:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    environment:
      - MODE=local
      - CATALOG_URL=http://lakekeeper:8181/catalog
    healthcheck:
      test: [ "CMD", "python", "-c", "from pyarrow import flight; flight.FlightClient('grpc://localhost:7001').wait_for_available(timeout=5)" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    develop:
      watch:
        - action: rebuild
          path: flight_server/src
